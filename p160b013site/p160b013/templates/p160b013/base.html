<!doctype html>
<html lang="en" class="h-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tourist RecSys{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            padding-top: 56px; /* Standard Bootstrap navbar height */
            background-color: #f8f9fa; /* Light grey background for contrast */
        }

        .navbar {
             /* Ensure it stays above */
             z-index: 1030;
        }

        main {
            flex: 1 0 auto; /* Make main content grow */
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
            background-color: #ffffff; /* White background for content area */
        }

        .container {
            max-width: 1140px; /* Standard container width */
        }

        .footer {
            flex-shrink: 0; /* Prevent footer from shrinking */
            padding: 1rem 0;
            background-color: #343a40;
            color: white;
            text-align: center;
        }

        .place-card img { height: 200px; object-fit: cover; }
        .recommendation-section { margin-bottom: 1.5rem; border: 1px solid #eee; border-radius: 5px; padding: 15px; background-color: #f9f9f9;}
        .recommendation-section h4 { margin-bottom: 1rem; font-size: 1.1rem; color: #333; border-bottom: 1px solid #ddd; padding-bottom: 5px;}
        .card-title-link { text-decoration: none; color: inherit; }
        .card-title-link:hover { color: #007bff; }
        .navbar-brand { font-weight: bold; }
        .list-group-item-action { font-size: 0.95rem; }
        .badge { font-size: 0.8em; }
        .color-block {
            width: 25px;
            height: 25px;
            border: 1px solid #ccc;
            margin-right: 5px;
            display: inline-block;
            border-radius: 4px;
        }
        .navbar-nav .dropdown-menu { margin-top: 0.5rem; }
        .shadow-sm { box-shadow: 0 .125rem .25rem rgba(0,0,0,.075)!important; }
        .card { transition: transform .2s; }
        .card:hover { transform: scale(1.02); }

    </style>
</head>
<body class="d-flex flex-column h-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'p160b013:index' %}">📍 Tourist RecSys</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}" aria-current="page" href="{% url 'p160b013:index' %}">Home</a>
                    </li>
                    {% if all_cities_nav %}
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle {% if request.resolver_match.url_name == 'city_view' %}active{% endif %}" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Cities
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            {% for c_nav in all_cities_nav %}
                            <li><a class="dropdown-item" href="{% url 'p160b013:city_view' c_nav.id %}">{{ c_nav.name }}</a></li>
                            {% endfor %}
                        </ul>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container shadow-sm p-4 mb-4 bg-white rounded">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer mt-auto py-3">
        <div class="container">
            <span>Big Data EP - 2025</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
